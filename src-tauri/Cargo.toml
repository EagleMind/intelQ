[package]
name = "intelquery"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "intelquery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# S3-compatible client for Cloudflare R2 backup/restore (single-object PUT/GET/HEAD).
# rustls TLS to match the runtime-tokio-rustls sqlx stack; no native-tls dependency.
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
# Passphrase (scrypt) encryption of the backup blob before it leaves the machine.
age = "0.10"

